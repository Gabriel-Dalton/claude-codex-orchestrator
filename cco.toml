# Local configuration takes precedence over the user's config file.
# Include {dir} to control directory placement for a different agent or shell.
# Otherwise cco appends Codex's -C <folder> argument.
agent_command = "codex -m {model} -c model_reasoning_effort={effort}"

[tiers.easy]
model = "gpt-5.6-luna"
effort = "medium"

[tiers.standard]
model = "gpt-5.6-terra"
effort = "medium"

[tiers.hard]
model = "gpt-6-astra"
effort = "medium"
